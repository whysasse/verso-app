name: Release

# UNTESTED SCAFFOLDING (FAB-150 step 3, Tasks 2-3, 2026-08-03).
#
# This workflow has never run successfully — it can't, until the six secrets
# below exist (FAB-150-step3-ci-release-pipeline.md, Task 0). It was written
# to match the plan's design but not exercised against a real Apple Developer
# account. Expect the first several runs to fail on provisioning specifics;
# that's expected per the plan, not evidence this file is wrong. In
# particular, the upload step (xcrun altool) is a best-guess at what's
# current — verify against the runner image before trusting it.
#
# Required secrets (GitHub -> Settings -> Secrets and variables -> Actions):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, DIST_CERT_P12, DIST_CERT_PASSWORD,
#   DEVELOPMENT_TEAM

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  release:
    name: Archive, sign, and upload to TestFlight
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Verify required secrets are configured
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          missing=()
          [ -z "$ASC_KEY_ID" ] && missing+=("ASC_KEY_ID")
          [ -z "$ASC_ISSUER_ID" ] && missing+=("ASC_ISSUER_ID")
          [ -z "$ASC_KEY_P8" ] && missing+=("ASC_KEY_P8")
          [ -z "$DIST_CERT_P12" ] && missing+=("DIST_CERT_P12")
          [ -z "$DIST_CERT_PASSWORD" ] && missing+=("DIST_CERT_PASSWORD")
          [ -z "$DEVELOPMENT_TEAM" ] && missing+=("DEVELOPMENT_TEAM")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}. See docs/plans/FAB-150-step3-ci-release-pipeline.md Task 0 for how to create them."
            exit 1
          fi

      # Pinned to match ci.yml (see that file's comment for why). Keep these two in sync.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write Secrets.xcconfig
        working-directory: Verso
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          cat > Secrets.xcconfig <<EOF
          DEVELOPMENT_TEAM = $DEVELOPMENT_TEAM
          TELEMETRY_DECK_APP_ID = AF772698-A152-4DBF-AEAA-B49EFDC7BF8C
          EOF

      - name: Generate Xcode project
        working-directory: Verso
        run: ./generate-xcodeproj.sh

      - name: Import distribution certificate into a temporary keychain
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist_cert.p12"
          security import "$RUNNER_TEMP/dist_cert.p12" -k "$KEYCHAIN_PATH" -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist_cert.p12"

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          AUTH_KEY_DIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$AUTH_KEY_DIR"
          AUTH_KEY_PATH="$AUTH_KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8" | base64 --decode > "$AUTH_KEY_PATH"
          echo "AUTH_KEY_PATH=$AUTH_KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive
        working-directory: Verso
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Verso.xcodeproj \
            -scheme Verso \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Verso.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Export IPA
        working-directory: Verso
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          # ExportOptions.plist is committed config, not a secret — it holds a
          # placeholder team ID that gets substituted here, at runtime, so the
          # real Team ID never lands in git history.
          sed "s/DEVELOPMENT_TEAM_PLACEHOLDER/$DEVELOPMENT_TEAM/" ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Verso.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # NOT VERIFIED (see header comment): confirm xcrun altool is still the
          # right tool on the macos-26 image before relying on this in a real run.
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/Verso.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Delete temporary keychain
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
