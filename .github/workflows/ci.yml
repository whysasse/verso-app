name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # FAB-314: WCAG contrast check over Verso/Shared/Colors.swift's actual hex
  # values -- no Xcode/Simulator involved (pure Python + regex + math), so this
  # runs on ubuntu-latest instead of the macos-26 runners the two build jobs
  # below need, and finishes long before either of them. See the script's own
  # docstring for what it checks and why some known failures don't fail CI.
  contrast-check:
    name: Contrast check (design tokens)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check_contrast.py

  # Fast smoke check: Debug, generic iOS destination so it builds without a
  # device/simulator boot. Kept alongside the Release/iOS job below because it's
  # ~1 minute and catches ordinary compile errors on every push/PR without
  # waiting on the slower, more realistic build. It would NOT have caught the
  # SwiftSoup Swift 6.4 regression that forced the 2.13.7 floor bump (011122c)
  # — that only reproduced in Release, on-device, with whole-module optimization
  # — which is exactly what the release-check job below exists to catch.
  #
  # Was "platform=macOS,variant=Designed for iPad" until 2026-08-24, when
  # TARGETED_DEVICE_FAMILY was restricted to iPhone-only (FAB-150 sequencing
  # decision — iPad UI isn't built yet, see FAB-131). That destination needs
  # iPad idiom support to resolve, so it stopped being valid for this scheme;
  # "generic/platform=iOS" is the standard no-simulator-boot equivalent for an
  # iPhone-only target. NOT yet verified by a real CI run — first push after
  # this change should be watched to confirm this job still passes.
  build:
    name: Build (Debug, macOS)
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      # Pinned explicitly (not "latest-stable") because Apple requires Xcode 26+ / iOS 26 SDK
      # for App Store Connect uploads since 2026-04-28, and the runner's default Xcode drifts
      # over time (26.5 -> 26.6 in July 2026). A release pipeline shouldn't silently change
      # compiler underneath it. 26.6 is the current default on the macos-26 image.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: Verso/Verso.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Verso/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Generate Xcode project
        working-directory: Verso
        run: ./generate-xcodeproj.sh

      - name: Build (no code signing)
        working-directory: Verso
        run: |
          set -o pipefail
          xcodebuild \
            -project Verso.xcodeproj \
            -scheme Verso \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            ASSETCATALOG_COMPILER_SKIP_APP_STORE_DEPLOYMENT=YES \
            build | xcpretty

  # Release-fidelity check: Release configuration, generic iOS device destination,
  # matching the archive release.yml actually produces (minus signing). This is
  # the job that would have caught the SwiftSoup Swift 6.4 regression, since that
  # only appeared under Release/device/whole-module-optimization, not Debug/macOS.
  release-check:
    name: Build (Release, iOS device)
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: Verso/Verso.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Verso/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Generate Xcode project
        working-directory: Verso
        run: ./generate-xcodeproj.sh

      - name: Build (Release, iOS, no code signing)
        working-directory: Verso
        run: |
          set -o pipefail
          xcodebuild \
            -project Verso.xcodeproj \
            -scheme Verso \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            ASSETCATALOG_COMPILER_SKIP_APP_STORE_DEPLOYMENT=YES \
            build | xcpretty
