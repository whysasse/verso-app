name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: Verso
        run: xcodegen generate

      - name: Build (no code signing)
        working-directory: Verso
        run: |
          xcodebuild \
            -project Verso.xcodeproj \
            -scheme Verso \
            -configuration Debug \
            -destination "platform=macOS,variant=Designed for iPad" \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty && exit ${PIPESTATUS[0]}
