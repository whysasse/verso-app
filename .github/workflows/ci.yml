name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: List available simulators
        run: xcrun simctl list devices available --json | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; [print(k, v[0]['name']) for k,v in d.items() if v and 'iOS' in k]" 2>/dev/null | head -5 || true

      - name: Generate Xcode project
        working-directory: Verso
        run: xcodegen generate

      - name: Build (no code signing)
        working-directory: Verso
        run: |
          xcodebuild \
            -project Verso.xcodeproj \
            -scheme Verso \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty && exit ${PIPESTATUS[0]}
